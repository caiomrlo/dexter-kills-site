<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dexter — Blood Slide Box (3D)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='60' y='20' rx='6' fill='rgba(210,240,235,0.6)' stroke='%2388bbaa' stroke-width='4'/><circle cx='50' cy='50' r='18' fill='%238b0d14'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;0,900;1,300;1,400;1,600;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Palco da caixa fechada (Seção 5): fundo vermelho com parallax + headline atrás da caixa -->
  <div class="kills-stage" aria-hidden="true">
    <div class="kills-bg"></div>
    <div class="kills-headline-wrap">
      <h2 class="kills-headline"><span class="kills-word kills-word--light">Dexter</span> <span class="kills-word kills-word--red">Kills</span></h2>
    </div>
  </div>

  <!-- Canvas 3D fixo em tela cheia (acompanha das lâminas livres na Seção 1 até a Caixa na Seção 4) -->
  <canvas id="webgpu-canvas"></canvas>

  <!-- Atmosfera sombria: névoa, brilho vermelho nas bordas, vinheta e grão (acima do canvas, abaixo do texto) -->
  <div class="dark-backdrop" aria-hidden="true"></div>

  <!-- WebGPU Fallback Notice -->
  <div id="webgpu-error" class="error-overlay hidden">
    <div class="error-box">
      <h2>WebGPU Não Disponível</h2>
      <p>Seu navegador não suporta ou não está com o <strong>WebGPU</strong> habilitado.</p>
      <p>Utilize uma versão recente do Chrome, Edge ou Firefox Nightly com WebGPU ativo.</p>
    </div>
  </div>

  <!-- Dica: clicar no fecho dourado para abrir a caixa (posicionada via projeção 3D) -->
  <div class="clasp-hint" aria-hidden="true">
    <span class="clasp-ring"></span>
    <span class="clasp-ring"></span>
    <span class="clasp-dot"></span>
  </div>

  <!-- Dossiê da vítima: aparece quando a lâmina sai da caixa (conteúdo gerado de assets/js/kills.js) -->
  <div class="kill-scrim" aria-hidden="true"></div>
  <aside id="kill-panel" class="kill-panel" aria-live="polite"></aside>

  <div id="smooth-wrapper">
    <div id="smooth-content">
      <!-- Seção 1 -->
      <section class="story-section section-1" data-section="1">
        <div class="section-inner">
          <h1 class="story-headline" data-split-words>
            Esta é a <span class="accent">noite.</span>
          </h1>
        </div>
        <div class="scroll-indicator" aria-hidden="true">
          <span class="scroll-label">SCROLL</span>
          <span class="scroll-line"></span>
        </div>
      </section>

      <!-- Seção 2 -->
      <section class="story-section section-2" data-section="2">
        <div class="section-inner">
          <h2 class="story-headline" data-split-words>
            E vai acontecer de novo e de <span class="accent">novo.</span>
          </h2>
        </div>
      </section>

      <!-- Seção 3 -->
      <section class="story-section section-3" data-section="3">
        <div class="section-inner">
          <h2 class="story-headline" data-split-words>
            Tem que <span class="accent">acontecer.</span>
          </h2>
        </div>
      </section>

      <!-- Seção 4: Caixa de Troféus 3D -->
      <section id="trophy-section" class="story-section viewer-section section-4" data-section="4">
      </section>

      <!-- Seção 5: Caixa fecha e permanece centralizada (sem texto) -->
      <section id="outro-section" class="outro-section" data-section="5"></section>
    </div>
  </div>

  <!-- GSAP Core + ScrollTrigger + ScrollSmoother + SplitText -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
