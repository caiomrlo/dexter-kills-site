<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dexter — Blood Slide Box (WebGPU 3D)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='60' y='20' rx='6' fill='rgba(210,240,235,0.6)' stroke='%2388bbaa' stroke-width='4'/><circle cx='50' cy='50' r='18' fill='%238b0d14'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="viewer-section">
    <div class="studio-backdrop" aria-hidden="true">
      <div class="parallax-layer bg-cyclorama" id="bg-cyclorama"></div>
      <div class="parallax-layer bg-softbox" id="bg-softbox"></div>
      <div class="parallax-layer bg-spotlight" id="bg-spotlight"></div>
      <div class="parallax-layer bg-surface-grain" id="bg-surface-grain"></div>
      <div class="parallax-layer bg-vignette"></div>
    </div>

    <canvas id="webgpu-canvas"></canvas>

    <div class="headline">
      <h1>
        <span class="line-blood">Alguns segredos não podem ser enterrados.</span>
        <span class="line-gray">Eles precisam ser guardados.</span>
      </h1>
    </div>

    <!-- WebGPU Fallback Notice -->
    <div id="webgpu-error" class="error-overlay hidden">
      <div class="error-box">
        <h2>WebGPU Não Disponível</h2>
        <p>Seu navegador não suporta ou não está com o <strong>WebGPU</strong> habilitado.</p>
        <p>Utilize uma versão recente do Chrome, Edge ou Firefox Nightly com WebGPU ativo.</p>
      </div>
    </div>
  </main>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
